name: Build Android

on:
  push:
    branches:
      - ci/build-custom-metrolist-apk
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant to build and upload as an artifact
        type: choice
        options: [benchmark, release, debug]
        default: benchmark

concurrency:
  # Dispatched APK builds get their own group so pushes to main cannot cancel them.
  group: android-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: write
    with:
      run-verification: false
      variant: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'benchmark' }}
      upload-artifact: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
      artifact-name: YMetrolist-optimized
      require-signing: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
      cache-read-only: ${{ github.event_name == 'pull_request' }}
    secrets:
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
      LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
